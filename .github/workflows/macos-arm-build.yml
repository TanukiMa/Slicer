name: Build Slicer macOS ARM

on:
  push:
    branches: [ macos-arm-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Build Environment
      run: |
        brew unlink cmake || true
        brew tap-new local/cmake-old
        brew extract --version=3.28.3 cmake local/cmake-old
        brew install cmake@3.28.3
        brew install qt@5 ninja
        
        echo "/opt/homebrew/opt/cmake@3.28.3/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/qt@5/bin" >> $GITHUB_PATH
        
    - name: Configure with ARM64 support
      run: |
        mkdir build && cd build
        cmake -GNinja \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DQt5_DIR:PATH=$(brew --prefix qt@5)/lib/cmake/Qt5 \
          -DCMAKE_OSX_ARCHITECTURES:STRING=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET:STRING=11.0 \
          -DSlicer_BUILD_TESTING:BOOL=OFF \
          -DSlicer_BUILD_DOCUMENTATION:BOOL=OFF \
          -DSlicer_BUILD_EXTENSIONS:BOOL=OFF \
          -DSlicer_USE_SYSTEM_TBB:BOOL=OFF \
          -DTBB_BUILD_SHARED:BOOL=ON \
          -DTBB_BUILD_STATIC:BOOL=OFF \
          ..
          
    - name: Build
      run: |
        cd build
        ninja -j1  # シングルスレッドで安定性向上
      timeout-minutes: 360  # 6時間制限
