name: Build Slicer macOS ARM

on:
  push:
    branches: [ macos-arm-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Build Environment
      run: |
        brew unlink cmake || true
        brew tap-new local/cmake-old
        brew extract --version=3.28.3 cmake local/cmake-old
        brew install cmake@3.28.3
        brew install qt@5 ninja
        
        echo "/opt/homebrew/opt/cmake@3.28.3/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/qt@5/bin" >> $GITHUB_PATH
        
    - name: Force ARM64 environment
      run: |
        # 全ての環境変数でARM64を強制
        echo "CMAKE_OSX_ARCHITECTURES=arm64" >> $GITHUB_ENV
        echo "ARCHFLAGS=-arch arm64" >> $GITHUB_ENV
        echo "CFLAGS=-arch arm64" >> $GITHUB_ENV
        echo "CXXFLAGS=-arch arm64" >> $GITHUB_ENV
        echo "LDFLAGS=-arch arm64" >> $GITHUB_ENV
        
    - name: Configure with forced architecture
      run: |
        mkdir build && cd build
        cmake -GNinja \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DQt5_DIR:PATH=$(brew --prefix qt@5)/lib/cmake/Qt5 \
          -DCMAKE_OSX_ARCHITECTURES:STRING=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET:STRING=13.0 \
          -DSlicer_BUILD_TESTING:BOOL=OFF \
          -DSlicer_BUILD_DOCUMENTATION:BOOL=OFF \
          -DSlicer_BUILD_EXTENSIONS:BOOL=OFF \
          -DSlicer_USE_SYSTEM_TBB:BOOL=OFF \
          -DCMAKE_CXX_FLAGS:STRING="-arch arm64" \
          -DCMAKE_C_FLAGS:STRING="-arch arm64" \
          -DSLICER_SUPERBUILD_CMAKE_OSX_ARCHITECTURES:STRING=arm64 \
          -DTBB_CMAKE_OSX_ARCHITECTURES:STRING=arm64 \
          ..
          
    - name: Clean and rebuild TBB if needed
      run: |
        cd build
        # TBBが既にx86_64でビルドされている場合、削除
        if [ -d "tbb-install/lib" ]; then
          rm -rf tbb-install tbb-build tbb-prefix
        fi
        
    - name: Build with forced ARM64
      run: |
        cd build
        ninja -j1 -v
      timeout-minutes: 360
