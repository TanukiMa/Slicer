name: Build Slicer macOS ARM

on:
  push:
    branches: [ macos-arm-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Build Environment
      run: |
        # CMake 3.x系をインストール（4.x系を回避）
        brew unlink cmake || true
        brew install cmake@3.29
        brew link cmake@3.29 --force
        
        # Qt5とNinja
        brew install qt@5 ninja
        
        # パス設定
        echo "/opt/homebrew/opt/cmake@3.29/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/qt@5/bin" >> $GITHUB_PATH
        
    - name: Verify versions
      run: |
        cmake --version
        which cmake
        
    - name: Configure
      run: |
        mkdir build && cd build
        cmake -GNinja \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DQt5_DIR:PATH=$(brew --prefix qt@5)/lib/cmake/Qt5 \
          -DSlicer_BUILD_TESTING:BOOL=OFF \
          -DSlicer_BUILD_DOCUMENTATION:BOOL=OFF \
          ..
          
    - name: Build
      run: |
        cd build
        ninja -j4
