name: Build Slicer macOS ARM

on:
  push:
    branches: [ macos-arm-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest  # ARM環境を維持
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Build Environment
      run: |
        # 現在のCMakeをアンリンク
        brew unlink cmake || true
        
        # 独自tapを作成してCMakeの古いバージョンを抽出
        brew tap-new local/cmake-old
        
        # CMake 3.28.x系を抽出（2023年のバージョン）
        brew extract --version=3.28.3 cmake local/cmake-old
        
        # 古いCMakeをインストール
        brew install cmake@3.28.3
        
        # Qt5とNinja
        brew install qt@5 ninja
        
        # パス設定
        echo "/opt/homebrew/opt/cmake@3.28.3/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/qt@5/bin" >> $GITHUB_PATH
        
    - name: Verify versions
      run: |
        cmake --version
        which cmake
        qmake --version || true
        
    - name: Configure
      run: |
        mkdir build && cd build
        cmake -GNinja \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DQt5_DIR:PATH=$(brew --prefix qt@5)/lib/cmake/Qt5 \
          -DSlicer_BUILD_TESTING:BOOL=OFF \
          -DSlicer_BUILD_DOCUMENTATION:BOOL=OFF \
          ..
          
    - name: Build
      run: |
        cd build
        ninja -j4
